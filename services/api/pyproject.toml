[tool.poetry]
name = "ospmae-api"
version = "0.1.0"
description = "OSPMAE FastAPI backend"
authors = ["OSPMAE Team <noreply@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = {version = "^0.53.0", extras = ["standard"]}
SQLAlchemy = "^2.0.47"
alembic = "^1.18.4"
psycopg = {version = "^3.3.3", extras = ["binary"]}
psycopg2-binary = "^2.9.11"
pydantic = "^2"
pydantic-core = "^2.47"
pydantic-settings = "^2.13.1"
python-multipart = "^0.0.32"
openpyxl = "^3.1.5"
itsdangerous = "^2.2.0"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
bcrypt = "^5.0.0"
starlette = "^1"

# OIDC (native RP)
authlib = "^1.6.8"
httpx = "^0.28.0"

# Async dependency discovery + background jobs
celery = "^5.6.2"
redis = "^8"
PyYAML = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-cov = ">=5"
ruff = "0.17.0"
mypy = "1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:authlib",
    "ignore::DeprecationWarning:starlette",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
