[tool.poetry]
name = "ospmae-api"
version = "0.2.0"
description = "OSPMAE FastAPI backend"
authors = ["OSPMAE Team <noreply@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
mosp = { git = "https://github.com/FERCBusters/mosp.git", rev = "7138fd8c6bbba4d1a8bacbcec0a8769ee1b9579d" }
fastapi = "*"
uvicorn = {version = "^0.53.0", extras = ["standard"]}
SQLAlchemy = "^2.0.47"
alembic = "^1.18.4"
psycopg = {version = "^3.3.3", extras = ["binary"]}
pydantic = "^2"
pydantic-core = "^2.47"
pydantic-settings = "^2.13.1"
python-multipart = "0.0.32"
starlette = "^1"
openpyxl = "^3.1.5"
# Private repository tokens are encrypted at rest.
cryptography = ">=50"

# Background jobs: dependency discovery, release feeds, mail outbox,
# maintenance.
celery = "^5.6.2"
redis = "^8"
PyYAML = "^6.0.3"
# Release feeds, fetched from the addresses they were validated against.
httpx2 = "^2.13.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
fakeredis = "^2.39"
pytest-cov = ">=5"
ruff = "0.17.0"
mypy = "1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
