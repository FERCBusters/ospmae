# NOTE: this file is the default server for the OSPMAE UI image; it lives in
# the http {} context from nginx's stock configuration, so it may define maps.

# WebSocket upgrade helper
map $http_upgrade $ospmae_upgrade {
  default "";
  websocket "websocket";
}

map $http_upgrade $ospmae_connection {
  default "close";
  websocket "upgrade";
}

# Cache successful vendor assets; failed requests must remain retryable.
map $status $ospmae_vendor_cache_control {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}

# HTML and first-party modules use stable URLs and must stay fresh together.
# Keep all add_header directives at server level so cache overrides cannot
# suppress the security headers through nginx location inheritance.
# An empty value leaves the cache policy for other responses unchanged.
map $uri $ospmae_cache_control {
  default "";
  / "no-store";
  ~*\.html$ "no-store";
  ~^/vendor/ $ospmae_vendor_cache_control;
  /styles.css "no-store";
  /app.js "no-store";
  /mosp-shell.js "no-store";
  /mosp-ui-config.js "no-store";
  ~^/pages/ "no-store";
  # Static binary assets: filenames change when their content changes.
  ~*\.(?:png|jpe?g|webp|ico|svg)$ "public, max-age=86400";
}

# Security headers: only add if upstream didn't set them (avoid duplication).
# $upstream_http_<header-name> contains the header value from upstream, or
# empty when the response came from a static file, so a static file always
# gets the header and an API decision can keep overriding it.
map $upstream_http_x_content_type_options $x_content_type_options_value {
  default "";
  "" "nosniff";
}

map $upstream_http_x_frame_options $x_frame_options_value {
  default "";
  "" "SAMEORIGIN";
}

map $upstream_http_referrer_policy $referrer_policy_value {
  default "";
  "" "strict-origin-when-cross-origin";
}

map $upstream_http_cross_origin_opener_policy $cross_origin_opener_policy_value {
  default "";
  "" "same-origin";
}

map $upstream_http_content_security_policy $content_security_policy_value {
  default "";
  "" "default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self';";
}

map $upstream_http_strict_transport_security $strict_transport_security_value {
  default "";
  "" "max-age=31536000; includeSubDomains; preload";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 40M;

  # Hide server information
  server_tokens off;

  # Security headers: only added if upstream (API) didn't set them.
  # For static assets (no upstream), these will be applied.
  # For API responses, upstream headers take precedence.
  add_header X-Content-Type-Options $x_content_type_options_value always;
  add_header X-Frame-Options $x_frame_options_value always;
  add_header Referrer-Policy $referrer_policy_value always;
  add_header Cross-Origin-Opener-Policy $cross_origin_opener_policy_value always;
  add_header Strict-Transport-Security $strict_transport_security_value always;
  add_header Content-Security-Policy $content_security_policy_value always;
  add_header Cache-Control $ospmae_cache_control always;

  # API upstream (resolved at request time to avoid startup DNS races)
  set $ospmae_api "http://component-api:8080";

  # Redirects carry a relative Location, so they keep the browser's scheme,
  # host and port behind a TLS proxy or a published container port.
  absolute_redirect off;

  # A path beginning with "//" merges to a single "/" for nginx's locations
  # while the browser keeps "//host/..." as its own path, which a script
  # echoing the path outward would send to another host. $uri is already
  # merged and decoded, so this server-level check reads the path as the
  # browser sent it and runs before any location block. An API client whose
  # base URL ends in "/" sends "//v1/..."; such a request gets 404 and the
  # client sees the failure.
  if ($request_uri ~ "^//") {
    return 400;
  }

  # ---------------------------------------------------------------------------
  # Static assets (no auth gate; the pages authenticate over the API).
  # ---------------------------------------------------------------------------

  # During development, the UI is frequently rebuilt without fingerprinted
  # asset names: core first-party files use no-cache-style freshness rules
  # from the map above, and vendored assets are immutable.
  location ^~ /vendor/ {
    try_files $uri =404;
  }
  location = /styles.css {
    try_files $uri =404;
  }
  location = /app.js {
    try_files $uri =404;
  }
  location = /mosp-shell.js {
    try_files $uri =404;
  }
  location = /mosp-ui-config.js {
    try_files $uri =404;
  }
  location ^~ /pages/ {
    try_files $uri =404;
  }

  # Unauthenticated pages (sign-in flows), exact only.
  location = /login.html {
    try_files $uri =404;
  }
  location = /preferences.html {
    return 301 /account.html;
  }
  location = /favicon.svg {
    try_files $uri =404;
  }

  # The dashboard is the product's entry page: a browser arriving at the site
  # root gets it served in place (no redirect), so bookmarks and typed URLs
  # keep the bare path.
  location = / {
    try_files /index.html =404;
  }

  # Root page.
  location = /index.html {
    try_files $uri =404;
  }

  # Remaining pages: exact try_files, no auth gate (the API enforces auth).
  location ~* \.html$ {
    try_files $uri =404;
  }

  # Fallback for unknown paths: 404 rather than silently serving the dashboard.
  location / {
    try_files $uri =404;
  }

  # ---------------------------------------------------------------------------
  # API proxy (the API enforces its own authentication and CSRF).
  # ---------------------------------------------------------------------------

  location /v1/ {
    proxy_pass http://component-api:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;

    # Identity headers: the API honours its configured identity header only
    # from a trusted socket peer, and only upstream-auth deployments supply
    # their own proxy configuration that sets it. The client's copies of
    # every identity header are cleared.
    proxy_set_header REMOTE_USER "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Vouch-User "";
    proxy_set_header X-Forwarded-User "";

    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
  }

  # WebSocket notification channel (same authentication rules as /v1/).
  location /ws/ {
    proxy_pass http://component-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $ospmae_upgrade;
    proxy_set_header Connection $ospmae_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header REMOTE_USER "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Vouch-User "";
    proxy_set_header X-Forwarded-User "";
    proxy_read_timeout 3600s;
  }
}
