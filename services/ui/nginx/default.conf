server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Security headers ----
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
  add_header Pragma "no-cache" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests;" always;

  # ---- API proxy ----
  location /ws/ {
    proxy_pass http://component-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 3600;
  }

  location /v1/ {
    proxy_pass http://component-api:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Trusted identity headers for upstream-auth mode.
    proxy_set_header REMOTE_USER $remote_user;
    proxy_set_header X-Vouch-User $http_x_vouch_user;
    proxy_set_header X-Forwarded-User $http_x_forwarded_user;

    # pass cookies both ways
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }

  # ---- static SPA ----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
