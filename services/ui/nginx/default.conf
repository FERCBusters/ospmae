# NOTE: this file is the default server for the OSPMAE UI image; it lives in
# the http {} context from nginx's stock configuration, so it may define maps.

# WebSocket upgrade helper
map $http_upgrade $ospmae_upgrade {
  default "";
  websocket "websocket";
}

map $http_upgrade $ospmae_connection {
  default "close";
  websocket "upgrade";
}

# Cache successful vendor assets; failed requests must remain retryable.
map $status $ospmae_vendor_cache_control {
  default "no-store";
  200 "public, max-age=31536000, immutable";
  206 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}

# HTML and first-party modules use stable URLs and must stay fresh together.
# Keep all add_header directives at server level so cache overrides cannot
# suppress the security headers through nginx location inheritance.
# An empty value leaves the cache policy for other responses unchanged.
map $uri $ospmae_cache_control {
  default "";
  # API answers are account data: never stored by a browser or by a cache in
  # front of nginx, whatever the path ends in. First, so no later pattern
  # (an image suffix, say) applies to an API path. A socket upgrade is left
  # as it is.
  ~^/v1/ "no-store";
  ~^/ws/ "";
  / "no-store";
  ~*\.html$ "no-store";
  # The design system is first-party code at a stable URL, and the pages and
  # API shipped with it depend on its version (it reads the CSRF cookie, for
  # one), so a browser checks for a newer copy before each use. The first
  # matching pattern applies, so this precedes the rule for other vendor files.
  ~^/vendor/mosp-design-system/ "no-cache";
  ~^/vendor/ $ospmae_vendor_cache_control;
  /styles.css "no-store";
  /app.js "no-store";
  /mosp-shell.js "no-store";
  /mosp-ui-config.js "no-store";
  ~^/pages/ "no-store";
  # Static binary assets: filenames change when their content changes.
  ~*\.(?:png|jpe?g|webp|ico|svg)$ "public, max-age=86400";
}

# Security headers: only add if upstream didn't set them (avoid duplication).
# $upstream_http_<header-name> contains the header value from upstream, or
# empty when the response came from a static file, so a static file always
# gets the header and an API decision can keep overriding it.
map $upstream_http_x_content_type_options $x_content_type_options_value {
  default "";
  "" "nosniff";
}

map $upstream_http_x_frame_options $x_frame_options_value {
  default "";
  "" "SAMEORIGIN";
}

map $upstream_http_referrer_policy $referrer_policy_value {
  default "";
  "" "strict-origin-when-cross-origin";
}

map $upstream_http_cross_origin_opener_policy $cross_origin_opener_policy_value {
  default "";
  "" "same-origin";
}

map $upstream_http_content_security_policy $content_security_policy_value {
  default "";
  "" "default-src 'self'; script-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self';";
}

map $upstream_http_strict_transport_security $strict_transport_security_value {
  default "";
  "" "max-age=31536000; includeSubDomains; preload";
}

# Browsers' XSS auditors are retired; any that remain are switched off, since
# their filtering could itself be turned against a page.
map $upstream_http_x_xss_protection $x_xss_protection_value {
  default "";
  "" "0";
}

# No page uses these device features, so none may be requested, by OSPMAE's
# pages or by anything framed in them. The same policy as KEEN's.
map $upstream_http_permissions_policy $permissions_policy_value {
  default "";
  "" "geolocation=(), microphone=(), camera=()";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 40M;

  # Hide server information
  server_tokens off;

  # Security headers: only added if upstream (API) didn't set them.
  # For static assets (no upstream), these will be applied.
  # For API responses, upstream headers take precedence.
  add_header X-Content-Type-Options $x_content_type_options_value always;
  add_header X-Frame-Options $x_frame_options_value always;
  add_header Referrer-Policy $referrer_policy_value always;
  add_header Cross-Origin-Opener-Policy $cross_origin_opener_policy_value always;
  add_header Strict-Transport-Security $strict_transport_security_value always;
  add_header Content-Security-Policy $content_security_policy_value always;
  add_header X-XSS-Protection $x_xss_protection_value always;
  add_header Permissions-Policy $permissions_policy_value always;
  add_header Cache-Control $ospmae_cache_control always;

  # API upstream (resolved at request time to avoid startup DNS races)
  set $ospmae_api "http://component-api:8080";

  # Redirects carry a relative Location, so they keep the browser's scheme,
  # host and port behind a TLS proxy or a published container port.
  absolute_redirect off;

  # A path beginning with "//" merges to a single "/" for nginx's locations
  # while the browser keeps "//host/..." as its own path, which a script
  # echoing the path outward would send to another host. $uri is already
  # merged and decoded, so this server-level check reads the path as the
  # browser sent it and runs before any location block. An API client whose
  # base URL ends in "/" sends "//v1/..."; such a request gets 404 and the
  # client sees the failure.
  if ($request_uri ~ "^//") {
    return 400;
  }

  # ---------------------------------------------------------------------------
  # Auth gate for HTML pages (cookie-based sessions), as in KEEN.
  #
  # A page is served only to a signed-in browser: nginx asks the API first
  # (auth_request), so a signed-out browser never receives, and never briefly
  # shows, the application's pages. It gets the sign-in page in place, at the
  # address it asked for, and signing in continues to that address.
  # ---------------------------------------------------------------------------

  # Subrequest endpoint used by auth_request.
  location = /_auth_check {
    internal;

    proxy_pass $ospmae_api/v1/auth/check;
    proxy_http_version 1.1;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;

    # The client's copies of every identity header are cleared, as for /v1/.
    proxy_set_header REMOTE_USER "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Vouch-User "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Preferred-Username "";
    proxy_set_header X-Authenticated-User "";
    proxy_set_header X-Authentik-Username "";
    proxy_set_header X-Webauth-User "";

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  # Administrator-only check that hides the administration page. The decision
  # comes from the API's role data, not from anything nginx holds.
  location = /_auth_check_admin {
    internal;

    proxy_pass $ospmae_api/v1/auth/check-admin;
    proxy_http_version 1.1;

    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;

    proxy_set_header REMOTE_USER "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Vouch-User "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Preferred-Username "";
    proxy_set_header X-Authenticated-User "";
    proxy_set_header X-Authentik-Username "";
    proxy_set_header X-Webauth-User "";

    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  # Answers 404 to a signed-in account that is not an administrator.
  location = /_admin_404 {
    internal;
    return 404;
  }

  # ---------------------------------------------------------------------------
  # Static assets (no auth gate: scripts and styles hold no account data, and
  # the sign-in page needs them before anyone is signed in).
  # ---------------------------------------------------------------------------

  # During development, the UI is frequently rebuilt without fingerprinted
  # asset names: core first-party files use no-cache-style freshness rules
  # from the map above, and vendored assets are immutable.
  location ^~ /vendor/ {
    try_files $uri =404;
  }
  location = /styles.css {
    try_files $uri =404;
  }
  location = /app.js {
    try_files $uri =404;
  }
  location = /mosp-shell.js {
    try_files $uri =404;
  }
  location = /mosp-ui-config.js {
    try_files $uri =404;
  }
  location ^~ /pages/ {
    try_files $uri =404;
  }

  # Administration page and its scripts: hidden unless the signed-in account
  # is an administrator. Exact locations take precedence over /pages/ above.
  location = /admin.html {
    auth_request /_auth_check_admin;
    error_page 401 =403 /login.html;
    error_page 403 =404 /_admin_404;
    try_files $uri =404;
  }
  location = /pages/admin.js {
    auth_request /_auth_check_admin;
    error_page 401 =403 /login.html;
    error_page 403 =404 /_admin_404;
    try_files $uri =404;
  }
  location = /pages/admin-features.js {
    auth_request /_auth_check_admin;
    error_page 401 =403 /login.html;
    error_page 403 =404 /_admin_404;
    try_files $uri =404;
  }

  # Pages reachable without a session (sign-in flows), exact only. The second
  # factor page continues a sign-in whose session does not exist yet. The
  # e-mail confirmation page holds no account data, and loading it without a
  # session lets SameSite=Strict cookies work after navigation from mail; its
  # API requires a signed-in session and CSRF proof.
  location = /login.html {
    try_files $uri =404;
  }
  location = /mfa.html {
    try_files $uri =404;
  }
  location = /sso-email.html {
    try_files $uri =404;
  }
  location = /preferences.html {
    return 301 /account.html;
  }
  location = /favicon.svg {
    try_files $uri =404;
  }

  # The dashboard is the product's entry page: a browser arriving at the site
  # root gets it served in place (no redirect), so bookmarks and typed URLs
  # keep the bare path.
  location = / {
    auth_request /_auth_check;
    error_page 401 =403 /login.html;

    try_files /index.html =404;
  }

  # Every other page requires a signed-in session. The API still enforces
  # authentication and permissions on all data; this gate keeps the pages
  # themselves from a signed-out browser.
  location ~* \.html$ {
    auth_request /_auth_check;
    error_page 401 =403 /login.html;

    try_files $uri =404;
  }

  # Fallback for unknown paths: 404 rather than silently serving the
  # dashboard, and only to a signed-in browser, so a signed-out one learns
  # nothing about which paths exist.
  location / {
    auth_request /_auth_check;
    error_page 401 =403 /login.html;

    try_files $uri =404;
  }

  # ---------------------------------------------------------------------------
  # API proxy (the API enforces its own authentication and CSRF).
  # ---------------------------------------------------------------------------

  # ^~ keeps every path under these prefixes on the proxy: without it a
  # regular-expression location (the .html gate) would claim an API path
  # that happened to end the same way.

  location ^~ /v1/ {
    proxy_pass http://component-api:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;

    # Identity headers: the API honours its configured identity header only
    # from a trusted socket peer, and only upstream-auth deployments supply
    # their own proxy configuration that sets it. The client's copies of
    # the identity headers authenticating proxies commonly use are cleared
    # here. A header nginx is not told about passes through unchanged, so
    # a deployment that sets OSPMAE_REMOTE_USER_HEADER_NAME to any other
    # name must clear or overwrite that name here as well.
    proxy_set_header REMOTE_USER "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Vouch-User "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Preferred-Username "";
    proxy_set_header X-Authenticated-User "";
    proxy_set_header X-Authentik-Username "";
    proxy_set_header X-Webauth-User "";

    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
  }

  # WebSocket notification channel (same authentication rules as /v1/).
  location ^~ /ws/ {
    proxy_pass http://component-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $ospmae_upgrade;
    proxy_set_header Connection $ospmae_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header REMOTE_USER "";
    proxy_set_header Remote-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Vouch-User "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Preferred-Username "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Preferred-Username "";
    proxy_set_header X-Authenticated-User "";
    proxy_set_header X-Authentik-Username "";
    proxy_set_header X-Webauth-User "";
    proxy_read_timeout 3600s;
  }
}
