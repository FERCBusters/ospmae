<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capability • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/mosp-ui-config.js"></script>
</head>

<body data-page="capability">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
      <div>
        <h1 id="capTitle" class="h3 mb-1">Capability</h1>
        <div id="capSubtitle" class="text-secondary">Loading…</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-secondary" href="/comparisons.html?lens=capabilities"><i class="bi bi-diagram-3"></i> Project Comparisons</a>
        <button id="refreshBtn" class="btn btn-primary" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
    </div>

    <div id="notFound" class="alert alert-warning" style="display:none;">Capability not found.</div>

    <div class="row g-3">
      <div class="col-12">
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between">
            <span class="fw-semibold">Overview</span>
            <div id="capBadges" class="d-flex flex-wrap gap-2"></div>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-12 col-lg-8">
                <div class="small text-secondary">Capability</div>
                <div id="capName" class="fw-semibold"></div>
                <div id="capMeta" class="text-secondary small mt-1"></div>
              </div>
              <div class="col-12 col-lg-4">
                <div class="small text-secondary">Usage</div>
                <div class="mt-1">
                  <span id="capUsage" class="badge text-bg-secondary">0 projects</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="card" data-mosp-viz-section="capability-usage" data-mosp-viz-title="Used by projects visualisation">
          <div class="card-header d-flex align-items-center justify-content-between">
            <span class="fw-semibold">Used by projects</span>
            <span id="usedByCount" class="badge text-bg-secondary">0</span>
          </div>
          <div class="card-body" data-mosp-viz-body>
            <div id="capUsageGraph" class="graph graph-tall mb-3"></div>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>Project</th>
                    <th>Version</th>
                    <th class="text-center">Latest</th>
                    <th class="text-center">Draft</th>
                  </tr>
                </thead>
                <tbody id="usedByBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/d3/d3.min.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/capability.js"></script>
  <script type="module" src="/mosp-shell.js"></script>
</body>
</html>
