<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/mosp-ui-config.js"></script>
  <script src="/vendor/mosp-design-system/theme-boot.js"></script>
</head>

<body data-page="projects">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <div>
        <h1 class="h3 mb-1">Projects</h1>
        <div class="text-secondary small">
          Every project's latest release, what the scans found, and what is still unfixed —
          filters by organisation.
        </div>
      </div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <label class="small text-secondary" for="orgFilter">Organisation</label>
        <select id="orgFilter" class="form-select form-select-sm" style="min-width:200px;">
          <option value="">All organisations</option>
        </select>
        <button id="exportCsv" class="btn btn-outline-primary btn-sm" type="button">
          <i class="bi bi-download"></i> Export CSV
        </button>
        <a id="newProjectBtn" class="btn btn-primary btn-sm" href="/project-edit.html" hidden>
          <i class="bi bi-plus-lg"></i> New project
        </a>
      </div>
    </div>

    <div id="summary" class="row g-2 mb-3"></div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Project</th>
              <th>Organisation</th>
              <th>Latest release</th>
              <th>Scan state</th>
              <th class="text-end">Dependencies</th>
              <th>Unfixed vulnerabilities</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="7" class="text-secondary">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/mosp-shell.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/projects.js"></script>
</body>
</html>
