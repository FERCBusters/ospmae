<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSPMAE - Project Comparisons</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />

  <script src="/mosp-ui-config.js"></script>
  <script src="/vendor/mosp-design-system/theme-boot.js"></script>
</head>

<body data-page="visualisations">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
      <div>
        <h1 class="h3 mb-1">Project Comparisons</h1>
        <div class="text-secondary">Cross-project visualisations and ecosystem insights.</div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="btn-group" role="group" aria-label="Export">
          <button id="exportGraphPdfBtn" class="btn btn-outline-secondary" type="button" title="Export PDF"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
          <button id="exportGraphJpegBtn" class="btn btn-outline-secondary" type="button" title="Export JPEG"><i class="bi bi-file-earmark-image"></i> JPEG</button>
        </div>
        <button id="refreshBtn" class="btn btn-primary">Refresh</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12">
        <div class="card" data-mosp-filter-section="comparison-filters">
          <div class="card-header d-flex align-items-center justify-content-between">
            <span class="fw-semibold" id="chartTitle">Bipartite graph</span>
            <span id="vizMeta" class="small text-secondary"></span>
          </div>

          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-lg-3">
                <label class="form-label small mb-1" for="lens">Lens</label>
                <select id="lens" class="form-select">
                  <option value="dependencies">Common dependencies</option>
                  <option value="capabilities" selected>Common capabilities</option>
                  <option value="licenses">Common licenses</option>
                </select>
              </div>

              <div class="col-12 col-lg-3">
                <label class="form-label small mb-1" for="latestOnly">Versions</label>
                <div class="form-check form-switch">
                  <input id="latestOnly" class="form-check-input" type="checkbox" checked />
                  <label class="form-check-label" for="latestOnly">Latest versions only</label>
                </div>
              </div>

              <div class="col-6 col-lg-3">
                <label class="form-label small mb-1" for="limitProjects">Max projects</label>
                <input id="limitProjects" class="form-control" type="number" min="5" max="200" value="30" />
              </div>

              <div class="col-6 col-lg-3">
                <label class="form-label small mb-1" for="limitDeps" id="limitItemsLabel">Max items</label>
                <input id="limitDeps" class="form-control" type="number" min="10" max="500" value="80" />
              </div>

              <div class="col-12 col-lg-3">
                <label class="form-label small mb-1" for="minUsage">Min usage count</label>
                <input id="minUsage" class="form-control" type="number" min="1" max="50" value="2" />
              </div>

              <div class="col-12 d-flex flex-wrap gap-2 align-items-center mt-2">
                <button id="applyBtn" class="btn btn-outline-secondary">Apply</button>
                <span class="text-secondary small">Tip: hover nodes to highlight connections.</span>
              </div>
            </div>

            <div class="mt-3">
              <div id="bipartiteGraph" class="graph graph-tall"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="vizTooltip" class="card shadow" style="position: fixed; display: none; pointer-events: none; z-index: 1060; min-width: 220px; max-width: 360px;">
    <div class="card-body p-2">
      <div id="vizTooltipTitle" class="fw-semibold small"></div>
      <div id="vizTooltipBody" class="text-secondary small mt-1"></div>
    </div>
  </div>

  <script src="/vendor/d3/d3.min.js"></script>
  <script src="/vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/comparisons.js"></script>
  <script type="module" src="/mosp-shell.js"></script>
</body>
</html>
