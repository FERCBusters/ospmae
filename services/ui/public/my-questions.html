<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Questions • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/mosp-ui-config.js"></script>
</head>
<body data-page="my_questions">
  <div id="navbar"></div>
  <main class="container py-4">
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
      <div>
        <h1 class="h3 mb-1">My Questions</h1>
        <div class="text-secondary">Threads you have opened on projects, including any replies from maintainers.</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-secondary" href="/questions.html"><i class="bi bi-bell"></i> Questions inbox</a>
        <button id="refreshBtn" class="btn btn-primary" type="button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
    </div>

    <div id="status" class="alert alert-info" style="display:none;"></div>

    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between gap-2 flex-wrap">
        <div class="fw-semibold">Threads</div>
        <span id="questionsCount" class="badge text-bg-secondary">0</span>
      </div>
      <div class="card-body">
        <div id="emptyState" class="small text-secondary" style="display:none;">No questions yet.</div>
        <div class="table-responsive" id="questionsTableWrap" style="display:none;">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th>Updated</th>
                <th>Project</th>
                <th>Status</th>
                <th>Latest message</th>
                <th class="text-end">Open</th>
              </tr>
            </thead>
            <tbody id="questionsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="/pages/my-questions.js"></script>
</body>
</html>
