<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose new password • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="container">
    <div class="row justify-content-center align-items-center" style="min-height:100vh;">
      <div class="col-12 col-md-7 col-lg-5 col-xl-4">
        <div class="card">
          <div class="card-body">
            <div class="text-center mb-3">
              <img src="/favicon.svg" width="52" height="52" alt="OSPMAE" />
              <h1 class="h4 mt-2 mb-0">Choose a new password</h1>
              <div class="text-secondary small">This link can be used once.</div>
            </div>

            <div id="msg" class="text-secondary small mb-2"></div>

            <form id="resetForm" novalidate>
              <div class="mb-2">
                <label for="newPassword" class="form-label">New password</label>
                <input id="newPassword" class="form-control" type="password" autocomplete="new-password" required />
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm new password</label>
                <input id="confirmPassword" class="form-control" type="password" autocomplete="new-password" required />
              </div>

              <button id="resetBtn" class="btn btn-primary w-100" type="submit">Reset password</button>
              <div class="mt-3 text-center">
                <a class="small" href="/login.html">Back to sign in</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/reset-password.js"></script>
</body>
</html>
