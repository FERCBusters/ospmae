<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSPMAE - Login</title>
  <script src="/vendor/mosp-design-system/theme-boot.js"></script>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body data-page="login" class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
  <!-- The same sign-in card as KEEN's: a full-height column with the card in
       the middle of the window. -->
  <main id="main-content" class="container container-tight py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="card">
          <div class="card-header">
            <div class="d-flex align-items-center gap-2">
              <img src="/favicon.svg" alt="" width="28" height="28" class="login-brand-icon" />
              <h1 class="h5 fw-bold mb-0">Sign in</h1>
            </div>
            <div class="small-muted">OSPMAE requires authentication.</div>
          </div>
          <div class="card-body">
            <div id="msg" class="alert alert-info" role="status" hidden></div>

            <div id="ssoSection" class="d-none mb-3">
              <div id="ssoButtons" class="d-grid gap-2"></div>
              <div class="small-muted mt-2 text-center" data-sso-divider>or sign in with a password</div>
            </div>

            <form id="loginForm" method="post" action="/v1/auth/login" novalidate autocomplete="on">
              <fieldset id="loginFields" disabled>
              <div class="mb-3">
                <label class="form-label small-muted mb-1" for="username">Username</label>
                <input id="username" class="form-control" autocomplete="username" required />
              </div>
              <div class="mb-3">
                <label class="form-label small-muted mb-1" for="password">Password</label>
                <input id="password" class="form-control" type="password" autocomplete="current-password" required />
              </div>
              <div class="d-grid gap-2">
                <button id="loginBtn" class="btn btn-primary" type="submit">Sign in</button>
              </div>
              </fieldset>
              <div id="forgotWrap" class="mt-3 text-center d-none">
                <a class="small" href="/forgot-password.html">Forgot your password?</a>
              </div>
            </form>
            <p id="loginLoading" class="small-muted mt-2 mb-0" role="status">Sign-in is loading. If this message remains, reload the page.</p>
            <noscript><p>JavaScript is required to sign in securely.</p></noscript>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/login.js"></script>
</body>
</html>
