<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saved manifests • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/mosp-ui-config.js"></script>
  <script src="/vendor/mosp-design-system/theme-boot.js"></script>
</head>

<body data-page="manifests">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap mb-3">
      <div>
        <h1 class="h3 mb-1">Saved manifests</h1>
        <div class="text-secondary">Open a saved manifest to preview and export in JSON, spreadsheet, or Markdown.</div>
      </div>
      <button id="refreshBtn" class="btn btn-outline-secondary" type="button">Refresh</button>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div id="manifestList"></div>
      </div>
    </div>

    <div class="card" id="manifestDetailsCard" style="display:none;">
      <div class="card-body">
        <div class="d-flex align-items-start justify-content-between gap-2 flex-wrap">
          <div>
            <h2 id="manifestDetailsTitle" class="h5 mb-1"></h2>
            <div id="manifestDetailsMeta" class="text-secondary small"></div>
            <div id="manifestSharingArea" class="mt-2"></div>
          </div>
          <div class="d-flex gap-2 flex-wrap align-items-center">
            <button id="backToListBtn" class="btn btn-outline-secondary btn-sm" type="button">Back to list</button>
            <button id="exportJsonBtn" class="btn btn-outline-secondary btn-sm" type="button">Export JSON</button>
            <button id="exportXlsxBtn" class="btn btn-outline-secondary btn-sm" type="button">Export Spreadsheet</button>
            <button id="exportMdBtn" class="btn btn-outline-secondary btn-sm" type="button">Export Markdown</button>
            <button id="cloneManifestBtn" class="btn btn-outline-primary btn-sm" type="button" style="display:none;">Clone</button>
            <button id="deleteManifestBtn" class="btn btn-outline-danger btn-sm" type="button" style="display:none;">Delete</button>
          </div>
        </div>

        <div id="manifestDetailsFilters" class="mt-3"></div>
        <div id="manifestDetailsProjects" class="mt-3"></div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/saved-manifests.js"></script>
  <script type="module" src="/mosp-shell.js"></script>
</body>
</html>
