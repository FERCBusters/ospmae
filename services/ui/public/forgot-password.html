<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <script src="/vendor/mosp-design-system/theme-boot.js"></script>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
  <main id="main-content" class="container container-tight py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="card">
          <div class="card-header">
            <div class="d-flex align-items-center gap-2">
              <img src="/favicon.svg" alt="" width="28" height="28" class="login-brand-icon" />
              <h1 class="h5 fw-bold mb-0">Reset password</h1>
            </div>
            <div class="small-muted">We'll email you a one-time link.</div>
          </div>
          <div class="card-body">

            <div id="msg" class="text-secondary small mb-2"></div>

            <form id="resetRequestForm" method="post" action="/v1/auth/request-password-reset" novalidate>
              <fieldset id="formFields" disabled>
              <div class="mb-3">
                <label for="identifier" class="form-label">Email or username</label>
                <input id="identifier" class="form-control" autocomplete="username" required />
                <div class="form-text">If your account exists, we'll send a reset link.</div>
              </div>

              <button id="sendBtn" class="btn btn-primary w-100" type="submit">Send reset link</button>
              </fieldset>
              <div class="mt-3 text-center">
                <a class="small" href="/login.html">Back to sign in</a>
              </div>
            </form>
            <p id="formLoading" class="small-muted mt-2 mb-0" role="status">The reset form is loading. If this message remains, reload the page.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/forgot-password.js"></script>
</body>
</html>
