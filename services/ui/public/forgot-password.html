<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password • OSPMAE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <script src="/vendor/mosp-design-system/theme-boot.js"></script>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <main class="container">
    <div class="row justify-content-center align-items-center" style="min-height:100vh;">
      <div class="col-12 col-md-7 col-lg-5 col-xl-4">
        <div class="card">
          <div class="card-body">
            <div class="text-center mb-3">
              <img src="/favicon.svg" width="52" height="52" alt="OSPMAE" />
              <h1 class="h4 mt-2 mb-0">Reset password</h1>
              <div class="text-secondary small">We'll email you a one-time link.</div>
            </div>

            <div id="msg" class="text-secondary small mb-2"></div>

            <form id="resetRequestForm" novalidate>
              <div class="mb-3">
                <label for="identifier" class="form-label">Email or username</label>
                <input id="identifier" class="form-control" autocomplete="username" required />
                <div class="form-text">If your account exists, we'll send a reset link.</div>
              </div>

              <button id="sendBtn" class="btn btn-primary w-100" type="submit">Send reset link</button>
              <div class="mt-3 text-center">
                <a class="small" href="/login.html">Back to sign in</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/pages/forgot-password.js"></script>
</body>
</html>
