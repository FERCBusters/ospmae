name: Docker image pins

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-pins
  cancel-in-progress: false

jobs:
  check:
    name: Check pinned digests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify every tracked tag still resolves to its pinned digest
        run: |
          set -euo pipefail
          python3 -I tools/docker_image_pins.py check
          # New digests land through reviewed commits: a maintainer runs
          # python3 -I tools/docker_image_pins.py update (optionally with
          # --report-dir, which writes pr-body.md, commit-message.txt and
          # outputs.txt) and reviews the result in the normal flow.
