target-version = "py312"
line-length = 88

[lint]
select = [
    "E4", "E7", "E9", # Basic Python errors
    "F",              # Undefined names, unused imports, etc.
    "I",              # Import sorting
    # Security (flake8-bandit), limited to patterns that are almost always a
    # defect: evaluating code or data, unsafe deserialisers and XML parsers,
    # disabled or outdated TLS, shell commands, SQL assembled from strings,
    # template engines without escaping, weak hashes, non-cryptographic random
    # numbers and HTTP calls without a timeout. A line that is safe nevertheless
    # carries "# noqa: <rule>" with the reason beside it.
    "S102", "S113", "S301", "S302", "S307", "S310", "S311", "S313", "S314",
    "S315", "S316", "S317", "S318", "S319", "S323", "S324", "S501", "S502",
    "S503", "S504", "S505", "S506", "S507", "S508", "S509", "S601", "S602",
    "S604", "S605", "S608", "S609", "S612", "S701", "S702", "S704",
]

[lint.per-file-ignores]
# Migrations are fixed operator code: their SQL names tables from their own
# constants and binds every value.
"services/api/alembic/**" = ["S608"]
# Feature switches read settings at import time and are placed next to the
# schedules they gate; and the discovery imports mirror the task layout.
"services/api/app/celery_app.py" = ["E402"]
"services/api/app/tasks/dependency_discovery.py" = ["E402"]
# Tests build fixture content from constants and draw predictable random data.
"services/api/tests/**" = ["S311", "S314", "S608"]
# The pin tool resolves registry URLs it is designed to read.
"tools/docker_image_pins.py" = ["S310"]

[format]
quote-style = "double"
