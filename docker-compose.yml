services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ospmae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-ospmae}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5444:5432"
    networks: [componentnet]
    restart: unless-stopped

  component-api:
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8182:8080"
    networks: [componentnet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: valkey/valkey:7.2
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    networks: [componentnet]
    restart: unless-stopped

  component-worker:
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["./scripts/start-celery-worker.sh"]
    networks: [componentnet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  component-beat:
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["./scripts/start-celery-beat.sh"]
    volumes:
      - beatdata:/var/lib/ospmae
    networks: [componentnet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  component-ui:
    build:
      context: ..
      dockerfile: ospmae/services/ui/Dockerfile
    env_file: .env
    depends_on:
      - component-api
    ports:
      - "127.0.0.1:8082:80"
    networks: [componentnet]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  beatdata:

networks:
  componentnet:
    driver: bridge
