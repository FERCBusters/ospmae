# Third-party images are pinned by digest. tools/docker_image_pins.py and the
# Docker image pins workflow keep the digests current.
services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    # Only the database's own settings reach this container, not the whole
    # application .env with its provider and mail secrets.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ospmae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ospmae}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5444:5432"
    networks: [componentnet]
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:8@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    # The password reaches Valkey in a configuration file written as the
    # container starts. Process arguments are visible to every account on the
    # Docker host, so it is never passed as --requirepass. The image's own
    # entrypoint then starts Valkey as its unprivileged user.
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        escaped=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')
        printf 'save 60 1\nloglevel warning\nrequirepass "%s"\n' "$$escaped" > /tmp/valkey.conf
        chown valkey /tmp/valkey.conf 2>/dev/null || true
        exec docker-entrypoint.sh valkey-server /tmp/valkey.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks: [componentnet]
    restart: unless-stopped

  # The API is reached only through component-ui, whose nginx clears
  # client-supplied identity headers; it publishes no port of its own.
  component-api:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    build:
      context: ./services/api
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    env_file: .env
    environment:
      # Client addresses for sign-in and other per-address limits come through
      # two forwarding hops: the component-ui nginx container, and the network
      # gateway, where connections to the host's published port arrive (such
      # as from a TLS proxy on the host). Set the variable to override.
      OSPMAE_TRUSTED_PROXY_CIDRS: ${OSPMAE_TRUSTED_PROXY_CIDRS:-${OSPMAE_UI_ADDRESS:-172.30.66.10}/32,${OSPMAE_NETWORK_GATEWAY:-172.30.66.1}/32}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [componentnet]
    restart: unless-stopped

  # Clones and catalogues repositories named by project editors, so it runs
  # with bounded memory, processor and process budgets.
  component-worker:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${OSPMAE_WORKER_MEM_LIMIT:-2g}
    cpus: ${OSPMAE_WORKER_CPUS:-2.0}
    pids_limit: 256
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      # The API applies database migrations before it reports healthy.
      component-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["./scripts/start-celery-worker.sh"]
    networks: [componentnet]
    restart: unless-stopped

  component-beat:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    build:
      context: ./services/api
    env_file: .env
    depends_on:
      component-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["./scripts/start-celery-beat.sh"]
    volumes:
      - beatdata:/var/lib/ospmae
    networks: [componentnet]
    restart: unless-stopped

  component-ui:
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    depends_on:
      - component-api
    ports:
      - "127.0.0.1:8082:80"
    networks:
      componentnet:
        ipv4_address: ${OSPMAE_UI_ADDRESS:-172.30.66.10}
    restart: unless-stopped

volumes:
  pgdata:
  beatdata:

# A fixed subnet gives the component-ui proxy and the gateway known addresses
# for OSPMAE_TRUSTED_PROXY_CIDRS. Where it clashes with another network on the
# host, set OSPMAE_NETWORK_SUBNET, OSPMAE_NETWORK_GATEWAY and OSPMAE_UI_ADDRESS.
networks:
  componentnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${OSPMAE_NETWORK_SUBNET:-172.30.66.0/24}
          gateway: ${OSPMAE_NETWORK_GATEWAY:-172.30.66.1}
